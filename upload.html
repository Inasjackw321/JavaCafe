<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Script - Code Sandbox</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/dracula.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/monokai.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/material.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/python/python.min.js"></script>
</head>
<body>
    <!-- Animated Background -->
    <div class="animated-background">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
    </div>

    <!-- Header -->
    <header class="glass-header">
        <div class="header-content">
            <h1 class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 17l6-6-6-6M12 19h8"/>
                </svg>
                Code Sandbox
            </h1>
            <nav class="header-nav">
                <a href="index.html" class="nav-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"/>
                        <rect x="14" y="3" width="7" height="7"/>
                        <rect x="14" y="14" width="7" height="7"/>
                        <rect x="3" y="14" width="7" height="7"/>
                    </svg>
                    Browse
                </a>
                <a href="upload.html" class="nav-btn active">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
                    </svg>
                    Upload
                </a>
                <a href="playground.html" class="nav-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 17l6-6-6-6M12 19h8"/>
                    </svg>
                    Playground
                </a>
            </nav>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container">
        <div class="page-header">
            <h2>Upload Script</h2>
            <p class="page-subtitle">Share your code with the community</p>
        </div>
        <div class="glass-panel upload-form-container">
            <form id="uploadForm" class="upload-form">
                <div class="form-group">
                    <label for="scriptTitle">Title</label>
                    <input type="text" id="scriptTitle" class="glass-input" placeholder="My Amazing Script" required>
                </div>
                <div class="form-group">
                    <label for="scriptAuthor">Author</label>
                    <input type="text" id="scriptAuthor" class="glass-input" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <label for="scriptDescription">Description</label>
                    <textarea id="scriptDescription" class="glass-textarea" placeholder="What does your script do?" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label for="scriptLanguage">Language</label>
                    <select id="scriptLanguage" class="glass-select" required>
                        <option value="javascript">JavaScript</option>
                        <option value="html">HTML</option>
                        <option value="python">Python</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="scriptCode">Code</label>
                    <div id="uploadEditor"></div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="glass-btn primary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
                        </svg>
                        Upload Script
                    </button>
                    <a href="index.html" class="glass-btn">Cancel</a>
                </div>
            </form>
        </div>
    </main>

    <script src="upload.js"></script>
</body>
</html>
